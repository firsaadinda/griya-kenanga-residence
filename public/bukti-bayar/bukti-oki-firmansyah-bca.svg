    <text x="504" y="60" fill="#005BAA" font-size="13" font-weight="600" text-anchor="end">037-889-1234 (BCA)</text>
    <line x1="0" y1="76" x2="504" y2="76" stroke="#F1F5F9" stroke-width="1" />

    <!-- Row 3: Nama Pengirim -->
