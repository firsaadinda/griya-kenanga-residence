    <text x="504" y="180" fill="#0F172A" font-size="13" font-weight="600" text-anchor="end">Bank Central Asia (BCA)</text>
    <line x1="0" y1="196" x2="504" y2="196" stroke="#F1F5F9" stroke-width="1" />

    <!-- Row 6: No. Referensi -->
