    <text x="504" y="100" fill="#0F172A" font-size="13" font-weight="bold" text-anchor="end">OKI FIRMANSYAH</text>
    <line x1="0" y1="116" x2="504" y2="116" stroke="#F1F5F9" stroke-width="1" />

